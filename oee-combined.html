<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OEE Combined — Final Assembly</title>
<style>
  :root {
    /* Magna International brand: red #DA291C + neutral gray scale */
    --brand-red: #da291c;
    --charcoal: #3a3a3a;
    --status-green: #22a83a;
    --status-amber: #f2a20c;
    --status-amber-text: #e08d00;
    --status-red: #d7263d;
    --ink: #2b2b2b;
    --ink-muted: #6b6b6b;
    --line: #d9d9d9;
    --surface: #ffffff;
    --page: #f7f7f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--page); }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--page);
    color: var(--ink);
    padding: 14px 16px 18px;
  }
  .board { max-width: 1560px; margin: 0 auto; }

  /* ---------- Top header ---------- */
  .board-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 16px;
    margin-bottom: 14px;
  }
  .plant-badge {
    display: inline-block;
    background: var(--brand-red);
    color: #fff;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.5px;
    padding: 8px 24px;
    border-radius: 6px;
  }
  .board-title { text-align: center; }
  .board-title h1 {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--charcoal);
    line-height: 1.05;
  }
  /* ---------- Period columns ---------- */
  .columns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .period { display: flex; flex-direction: column; gap: 12px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-title {
    color: #fff;
    text-align: center;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.6px;
    padding: 8px 10px;
  }

  /* ---------- Gauges ---------- */
  .gauge-main { padding: 4px 10px 2px; }
  .gauge-main svg { display: block; width: 100%; height: auto; }
  .sub-gauges {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
  }
  .sub-gauge {
    padding: 8px 4px 10px;
    text-align: center;
  }
  .sub-gauge + .sub-gauge { border-left: 1px solid var(--line); }
  .sub-gauge .sub-name {
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .sub-gauge svg { display: block; width: 78%; max-width: 130px; height: auto; margin: 0 auto; }
  .sub-gauge .sub-value { font-size: 19px; font-weight: 800; margin-top: 1px; }
  .sub-gauge .sub-target {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--charcoal);
    margin-top: 1px;
  }

  /* ---------- Combined Top 3 + Actions ---------- */
  .combined {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 18px;
  }
  thead.light th {
    background: #f0f0f0;
    color: var(--ink-muted);
    border-bottom: 1px solid var(--line);
  }
  .top3-table { font-size: 14px; }
  .top3-table thead th:nth-child(1) { width: 4%; }
  .top3-table thead th:nth-child(2) { width: 13%; }
  .top3-table thead th:nth-child(3),
  .top3-table thead th:nth-child(4),
  .top3-table thead th:nth-child(5) { width: 9%; }
  .top3-table thead th:nth-child(6) { width: 16%; }
  .top3-table thead th:nth-child(7) { width: 24%; }
  .top3-table thead th:nth-child(8) { width: 8%; }
  .top3-table thead th:nth-child(9) { width: 8%; }
  .top3-table td.rank { font-weight: 800; }
  .top3-table td.name { font-weight: 700; }
  .top3-table td.pct { font-weight: 800; }
  .top3-table thead th:nth-child(2),
  .top3-table thead th:nth-child(6),
  .top3-table thead th:nth-child(7),
  .top3-table tbody td:nth-child(2),
  .top3-table tbody td:nth-child(6),
  .top3-table tbody td:nth-child(7) {
    text-align: left;
    padding-left: 14px;
  }

  /* ---------- Action table ---------- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    table-layout: fixed;
  }
  thead th {
    color: #fff;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.3px;
    padding: 8px 6px;
    text-align: center;
  }
  thead th:nth-child(1) { width: 19%; }
  thead th:nth-child(2) { width: 24%; }
  thead th:nth-child(3) { width: 28%; }
  thead th:nth-child(4) { width: 14%; }
  thead th:nth-child(5) { width: 15%; }
  tbody td {
    border: 1px solid var(--line);
    padding: 8px 7px;
    text-align: center;
    vertical-align: middle;
    line-height: 1.3;
  }
  tbody td.focus { font-weight: 700; }
  .pill {
    display: inline-block;
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.4px;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1.5px solid;
  }
  .pill.open   { color: var(--status-red);   border-color: var(--status-red); }
  .pill.closed { color: var(--status-green); border-color: var(--status-green); }

  /* ---------- Footer ---------- */
  .board-footer {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    margin-top: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 18px;
  }
  .notes { font-size: 13.5px; color: var(--ink); }
  .notes .notes-title { font-weight: 800; margin-bottom: 4px; }
  .notes ul { padding-left: 18px; }
  .notes li { margin-top: 2px; }
  .data-note { text-align: right; font-size: 13.5px; }
  .data-note strong { font-weight: 800; }

  @media (max-width: 1100px) {
    .columns { grid-template-columns: 1fr; }
    .board-header { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .legend { justify-self: center; }
    .board-footer { grid-template-columns: 1fr; }
    .data-note { text-align: center; }
  }
</style>
</head>
<body>
<div class="board" id="board"></div>

<script>
/* =========================================================================
   MOCK DATA — everything the board renders lives in this one object.
   Swap these values (or later, fetch real data into the same shape)
   and the gauges, lists and tables re-render from it.
   ========================================================================= */
const DATA = {
  plant: "FINAL ASSEMBLY",
  title: "OEE",
  scaleMax: 110,               // OEE evaluated up to 110%
  asOf: "May 22, 2025  08:00 AM",
  // Status thresholds: >= good → green, >= warn → amber, else red
  thresholds: { good: 80, warn: 60 },
  // Targets shown as markers on the gauges.
  // Quality follows from the OEE math: 80% / (90% × 90%) ≈ 98.8%
  targets: { OEE: 80, Performance: 90, Availability: 90, Quality: 98.8 },
  periods: [
    {
      title: "YESTERDAY",
      accent: "var(--charcoal)",
      oee: 78.6,
      components: { Performance: 82.3, Availability: 74.1, Quality: 96.2 }
    },
    {
      title: "WEEK TO DATE",
      accent: "var(--charcoal)",
      oee: 86.9,
      components: { Performance: 89.4, Availability: 85.7, Quality: 97.2 }
    },
    {
      title: "MONTH TO DATE",
      accent: "var(--charcoal)",
      oee: 72.3,
      components: { Performance: 77.6, Availability: 70.3, Quality: 93.9 }
    }
  ],
  // Top 3 and their actions combined: one row per failure mode, ranked by
  // month-to-date. pct values align with the periods array above
  // (Yesterday, Week to Date, Month to Date); the rest is the action.
  top3: [
    { focus: "Damaged Torque",    pct: [12.4, 10.1, 13.6], mode: "Over torque on screw",          cause: "Inconsistent torque wrench calibration", owner: "R. Patel", status: "OPEN" },
    { focus: "Damaged - Process", pct: [5.3,  4.4,  8.7],  mode: "Paint chip on product",         cause: "Handling contact during transfer",       owner: "M. Chen",  status: "OPEN" },
    { focus: "Focus and Align",   pct: [7.8,  6.2,  6.5],  mode: "Misalignment of camera module", cause: "Fixture wear causing misalignment",      owner: "J. Lee",   status: "OPEN" }
  ],
  notes: [
    "OEE = Availability × Performance × Quality",
    "OEE evaluated up to 110% (max) to recognize efficiency above planned standards."
  ]
};

/* =========================================================================
   Rendering
   ========================================================================= */
const MAX = DATA.scaleMax;
const SWEEP = 230;                 // total gauge sweep in degrees
const START = -SWEEP / 2;          // degrees from vertical (0 = straight up)

function statusColor(v, good = DATA.thresholds.good) {
  if (v >= good) return "var(--status-green)";
  if (v >= DATA.thresholds.warn) return "var(--status-amber-text)";
  return "var(--status-red)";
}
function paretoColor(pct) {
  return pct >= 10 ? "var(--status-red)" : "var(--status-amber-text)";
}
function angleFor(v) { return START + (Math.min(v, MAX) / MAX) * SWEEP; }
function pt(cx, cy, r, deg) {
  const a = deg * Math.PI / 180;
  return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
}
function bandPath(cx, cy, rOuter, rInner, v0, v1) {
  const a0 = angleFor(v0), a1 = angleFor(v1);
  const large = (a1 - a0) > 180 ? 1 : 0;
  const [x1, y1] = pt(cx, cy, rOuter, a0);
  const [x2, y2] = pt(cx, cy, rOuter, a1);
  const [x3, y3] = pt(cx, cy, rInner, a1);
  const [x4, y4] = pt(cx, cy, rInner, a0);
  return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} ` +
         `L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
}

// The green band starts at the gauge's target — the band edge IS the
// target indicator, so no separate marker is drawn.
function bandsFor(target) {
  return [
    { from: 0,                    to: DATA.thresholds.warn, color: "var(--status-red)" },
    { from: DATA.thresholds.warn, to: target,               color: "var(--status-amber)" },
    { from: target,               to: MAX,                  color: "var(--status-green)" }
  ];
}

function gaugeSVG(value, { size = "main", target = DATA.thresholds.good } = {}) {
  const main = size === "main";
  const W = main ? 380 : 120;
  const cx = W / 2;
  const R  = main ? 118 : 46;
  const rI = main ? R - 26 : R - 15;
  const cy = main ? 138 : 54;
  const H  = main ? cy + R * 0.58 : cy + R * 0.46;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gauge showing ${value}%">`;

  // colored bands with a small white gap between them
  bandsFor(target).forEach(b => {
    s += `<path d="${bandPath(cx, cy, R, rI, b.from, b.to)}" fill="${b.color}" stroke="var(--surface)" stroke-width="${main ? 2 : 1.2}"></path>`;
  });

  // ticks (main gauge only)
  if (main) {
    for (let v = 0; v <= MAX; v += 5) {
      const majorTick = v % 25 === 0 || v === MAX;
      const a = angleFor(v);
      const [x1, y1] = pt(cx, cy, R, a);
      const [x2, y2] = pt(cx, cy, R - (majorTick ? 10 : 5), a);
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#25314f" stroke-width="${majorTick ? 2 : 1}" opacity="0.85"></line>`;
    }
    // scale labels
    const labels = [0, 25, 50, 75, 100, 110];
    labels.forEach(v => {
      const a = angleFor(v);
      const [x, y] = pt(cx, cy, R + 17, a);
      const anchor = a < -12 ? "end" : a > 12 ? "start" : "middle";
      s += `<text x="${x}" y="${y + 4}" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="${anchor}">${v}%</text>`;
    });
    // center labels
    s += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="40" font-weight="900" fill="${statusColor(value)}">${value.toFixed(1)}%</text>`;
    s += `<text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--charcoal)">Target ${+target.toFixed(1)}%</text>`;
  }

  // needle
  const a = angleFor(value);
  const len = main ? rI - 32 : rI - 6;
  const base = main ? 55 : 8;   // needle starts away from center on main gauge
  const [tx, ty] = pt(cx, cy, len + base, a);
  const [bx, by] = pt(cx, cy, base, a);
  const [w1x, w1y] = pt(cx, cy, base + 4, a - (main ? 4 : 8));
  const [w2x, w2y] = pt(cx, cy, base + 4, a + (main ? 4 : 8));
  s += `<polygon points="${bx},${by} ${w1x},${w1y} ${tx},${ty} ${w2x},${w2y}" fill="#1c2333"></polygon>`;
  if (!main) s += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#1c2333"></circle>`;

  s += `</svg>`;
  return s;
}

function renderPeriod(p) {
  const subGauges = Object.entries(p.components).map(([name, v]) => `
    <div class="sub-gauge">
      <div class="sub-name">${name}</div>
      ${gaugeSVG(v, { size: "sub", target: DATA.targets[name] })}
      <div class="sub-value" style="color:${statusColor(v, DATA.targets[name])}">${v.toFixed(1)}%</div>
      <div class="sub-target">Target ${+DATA.targets[name].toFixed(1)}%</div>
    </div>`).join("");

  return `
  <section class="period">
    <div class="panel">
      <div class="panel-title" style="background:${p.accent}">${p.title}</div>
      <div class="gauge-main">${gaugeSVG(p.oee, { target: DATA.targets.OEE })}</div>
      <div class="sub-gauges">${subGauges}</div>
    </div>
  </section>`;
}

function renderCombined() {
  const rows = DATA.top3.map((t, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td class="name">${t.focus}</td>
      ${t.pct.map(v => `<td class="pct" style="color:${paretoColor(v)}">${v.toFixed(1)}%</td>`).join("")}
      <td>${t.mode}</td>
      <td>${t.cause}</td>
      <td>${t.owner}</td>
      <td><span class="pill ${t.status.toLowerCase()}">${t.status}</span></td>
    </tr>`).join("");

  return `
  <div class="combined">
    <div class="panel">
      <div class="panel-title" style="background:var(--brand-red)">TOP 3 ACTIONS</div>
      <table class="top3-table">
        <thead class="light">
          <tr>
            <th>#</th><th>Focus Area</th>
            ${DATA.periods.map(p => `<th>${p.title}</th>`).join("")}
            <th>Failure Mode</th><th>Root Cause Investigation</th><th>Owner</th><th>Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function render() {
  document.getElementById("board").innerHTML = `
    <header class="board-header">
      <div>
        <span class="plant-badge">${DATA.plant}</span>
      </div>
      <div class="board-title">
        <h1>${DATA.title}</h1>
      </div>
      <div></div>
    </header>

    <div class="columns">
      ${DATA.periods.map(renderPeriod).join("")}
    </div>

    ${renderCombined()}

    <footer class="board-footer">
      <div class="notes">
        <div class="notes-title">Notes:</div>
        <ul>${DATA.notes.map(n => `<li>${n}</li>`).join("")}</ul>
      </div>
      <div class="data-note">
        <div class="as-of">Data as of: <strong>${DATA.asOf}</strong></div>
      </div>
    </footer>`;
}
render();
</script>
</body>
</html>
