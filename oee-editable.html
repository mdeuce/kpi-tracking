<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OEE Editable — Final Assembly</title>
<style>
  :root {
    --navy: #16336e;
    --navy-dark: #0d1f45;
    --header-blue: #1d3f8f;
    --header-green: #2e8b3d;
    --header-purple: #5a4fa8;
    --status-green: #22a83a;
    --status-amber: #f2a20c;
    --status-amber-text: #e08d00;
    --status-red: #d7263d;
    --ink: #1a2440;
    --ink-muted: #46536f;
    --line: #c9d2e0;
    --surface: #ffffff;
    --page: #f4f6fb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--page); }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--page);
    color: var(--ink);
    padding: 0.8vh 0.7vw;
    overflow: hidden;
  }
  /* The board fills the viewport: header and tables take what they need,
     the main gauges absorb whatever vertical space is left over. */
  .board {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.9vh;
  }

  /* ---------- Top header ---------- */
  .board-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }
  /* Department switcher — the active one reads as the old plant badge */
  .dept-switch { display: flex; gap: 6px; flex-wrap: wrap; }
  .dept-tab {
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(10px, 0.95vw, 18px);
    letter-spacing: 0.4px;
    padding: 0.7vh 0.9vw;
    border-radius: 6px;
    border: 1.5px solid var(--header-blue);
    background: var(--surface);
    color: var(--header-blue);
    cursor: pointer;
    white-space: nowrap;
  }
  .dept-tab:hover { background: #e7edfa; }
  .dept-tab.active {
    background: var(--header-blue);
    color: #fff;
    cursor: default;
  }
  .board-title { text-align: center; }
  .board-title h1 {
    font-size: clamp(26px, 2.9vw, 58px);
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--navy-dark);
    line-height: 1.05;
  }
  /* ---------- Period columns ---------- */
  /* Two grid rows — gauges (fills the slack) and tables (natural height) —
     so all three columns line up no matter how their text wraps. */
  .columns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8vw;
  }
  .columns.gauges-row { flex: 1; min-height: 0; }
  .columns.tables-row { flex: 0 0 auto; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel.gauges {
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .panel-title {
    color: #fff;
    text-align: center;
    font-weight: 800;
    font-size: clamp(13px, 1.15vw, 22px);
    letter-spacing: 0.6px;
    padding: 0.7vh 10px;
  }

  /* ---------- Gauges ---------- */
  .gauge-main {
    flex: 1;
    min-height: 0;
    padding: 0.5vh 10px 0.2vh;
  }
  .gauge-main svg { display: block; width: 100%; height: 100%; }
  .sub-gauges {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
    flex: 0 0 auto;
    height: 22vh;
  }
  .sub-gauge {
    padding: 0.7vh 4px 0.8vh;
    text-align: center;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sub-gauge + .sub-gauge { border-left: 1px solid var(--line); }
  .sub-gauge .sub-name {
    font-size: clamp(10px, 0.8vw, 16px);
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .sub-gauge svg { display: block; width: 100%; height: 100%; flex: 1; min-height: 0; }
  .sub-gauge .sub-value { font-size: clamp(14px, 1.25vw, 26px); font-weight: 800; margin-top: 1px; }
  .sub-gauge .sub-target {
    font-size: clamp(9px, 0.72vw, 15px);
    font-weight: 700;
    color: var(--navy);
    margin-top: 1px;
  }

  /* ---------- Per-period Top 3 Actions table ---------- */
  thead.light th {
    background: #eef2f9;
    color: var(--ink-muted);
    border-bottom: 1px solid var(--line);
  }
  .top3-table { font-size: clamp(10px, 0.76vw, 16px); }
  .top3-table thead th { padding: 0.6vh 5px; }
  .top3-table tbody td { padding: 0.9vh 5px; }
  .top3-table thead th:nth-child(1) { width: 6%; }
  .top3-table thead th:nth-child(2) { width: 18%; }
  .top3-table thead th:nth-child(3) { width: 9%; }
  .top3-table thead th:nth-child(4) { width: 20%; }
  .top3-table thead th:nth-child(5) { width: 23%; }
  .top3-table thead th:nth-child(6) { width: 11%; }
  .top3-table thead th:nth-child(7) { width: 13%; }
  .top3-table .pill { font-size: clamp(8.5px, 0.62vw, 13px); padding: 3px 5px; letter-spacing: 0.2px; }
  .top3-table td.rank { font-weight: 800; }
  .top3-table td.name { font-weight: 700; }
  .top3-table td.pct { font-weight: 800; }
  /* ---------- Inline editing ---------- */
  .edit-hint {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(10px, 0.72vw, 14px);
    color: var(--ink-muted);
  }
  .btn-reset {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 11px;
    cursor: pointer;
  }
  .btn-reset:hover { background: #eef2f9; }
  td.edit { cursor: text; }
  td.edit:hover { background: #eef4fd; box-shadow: inset 0 0 0 1px #b9c8e2; }
  td.edit:focus {
    outline: 2px solid var(--header-blue);
    outline-offset: -2px;
    background: #fff;
    box-shadow: none;
  }
  td.edit.saved { animation: flash 0.6s ease-out; }
  @keyframes flash { from { background: #d8f0dd; } to { background: transparent; } }
  .pill.editable { cursor: pointer; user-select: none; }
  .pill.editable:hover { box-shadow: 0 0 0 2px rgba(29, 63, 143, 0.18); }

  /* Editable gauge readouts */
  .sub-value.edit {
    cursor: text;
    border-radius: 4px;
    margin: 0 6px;
  }
  .sub-value.edit:hover { background: #eef4fd; box-shadow: inset 0 0 0 1px #b9c8e2; }
  .sub-value.edit:focus {
    outline: 2px solid var(--header-blue);
    outline-offset: -2px;
    background: #fff;
    box-shadow: none;
  }
  .sub-value.edit.saved { animation: flash 0.6s ease-out; }
  text.gauge-value { cursor: pointer; }
  text.gauge-value:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  text.gauge-value:focus { outline: none; text-decoration: underline; text-decoration-thickness: 2px; }
  .value-editor {
    position: fixed;
    transform: translate(-50%, -50%);
    z-index: 20;
    font-family: inherit;
    font-size: clamp(18px, 1.7vw, 36px);
    font-weight: 900;
    text-align: center;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--header-blue);
    border-radius: 8px;
    padding: 2px 6px;
    box-shadow: 0 8px 24px rgba(13, 31, 69, 0.22);
  }
  .value-editor:focus { outline: none; }

  /* Focus Area, Failure Mode and Root Cause read left-aligned */
  .top3-table thead th:nth-child(2),
  .top3-table thead th:nth-child(4),
  .top3-table thead th:nth-child(5),
  .top3-table tbody td:nth-child(2),
  .top3-table tbody td:nth-child(4),
  .top3-table tbody td:nth-child(5) {
    text-align: left;
    padding-left: 8px;
  }

  /* ---------- Action table ---------- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    table-layout: fixed;
  }
  thead th {
    color: #fff;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.3px;
    padding: 8px 6px;
    text-align: center;
  }
  thead th:nth-child(1) { width: 19%; }
  thead th:nth-child(2) { width: 24%; }
  thead th:nth-child(3) { width: 28%; }
  thead th:nth-child(4) { width: 14%; }
  thead th:nth-child(5) { width: 15%; }
  tbody td {
    border: 1px solid var(--line);
    padding: 8px 7px;
    text-align: center;
    vertical-align: middle;
    line-height: 1.3;
  }
  tbody td.focus { font-weight: 700; }
  .pill {
    display: inline-block;
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: 0.4px;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1.5px solid;
  }
  .pill.open   { color: var(--status-red);   border-color: var(--status-red); }
  .pill.closed { color: var(--status-green); border-color: var(--status-green); }

  @media (max-width: 1100px) {
    body { overflow: auto; }
    html, body { height: auto; }
    .board { height: auto; }
    .columns { grid-template-columns: 1fr; grid-template-rows: none; }
    .board-header { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .sub-gauges { height: auto; }
    .sub-gauge svg { height: auto; }
  }
</style>
</head>
<body>
<div class="board" id="board"></div>

            { focus: "Damaged - Process", pct: 8.7,  mode: "Paint chip on product", cause: "Handling contact during transfer",       owner: "M. Chen",  status: "OPEN" },

// Which department is on screen. Everything renders from dept().periods.
let activeDept = 0;
const dept = () => DATA.departments[activeDept];

/* =========================================================================
   Rendering
   ========================================================================= */
const MAX = DATA.scaleMax;
const SWEEP = 230;                 // total gauge sweep in degrees
const START = -SWEEP / 2;          // degrees from vertical (0 = straight up)

function statusColor(v, good = DATA.thresholds.good) {
  if (v >= good) return "var(--status-green)";
  if (v >= DATA.thresholds.warn) return "var(--status-amber-text)";
  return "var(--status-red)";
}
function paretoColor(pct) {
  return pct >= 10 ? "var(--status-red)" : "var(--status-amber-text)";
}
function angleFor(v) { return START + (Math.min(v, MAX) / MAX) * SWEEP; }
function pt(cx, cy, r, deg) {
  const a = deg * Math.PI / 180;
  return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
}
function bandPath(cx, cy, rOuter, rInner, v0, v1) {
  const a0 = angleFor(v0), a1 = angleFor(v1);
  const large = (a1 - a0) > 180 ? 1 : 0;
  const [x1, y1] = pt(cx, cy, rOuter, a0);
  const [x2, y2] = pt(cx, cy, rOuter, a1);
  const [x3, y3] = pt(cx, cy, rInner, a1);
  const [x4, y4] = pt(cx, cy, rInner, a0);
  return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} ` +
         `L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
}

// The green band starts at the gauge's target — the band edge IS the
// target indicator, so no separate marker is drawn.
function bandsFor(target) {
  return [
    { from: 0,                    to: DATA.thresholds.warn, color: "var(--status-red)" },
    { from: DATA.thresholds.warn, to: target,               color: "var(--status-amber)" },
    { from: target,               to: MAX,                  color: "var(--status-green)" }
  ];
}

function gaugeSVG(value, { size = "main", target = DATA.thresholds.good, editP = null } = {}) {
  const main = size === "main";
  const W = main ? 380 : 120;
  const cx = W / 2;
  const R  = main ? 118 : 46;
  const rI = main ? R - 26 : R - 15;
  const cy = main ? 138 : 54;
  const H  = main ? cy + R * 0.58 : cy + R * 0.46;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gauge showing ${value}%">`;

  // colored bands with a small white gap between them
  bandsFor(target).forEach(b => {
    s += `<path d="${bandPath(cx, cy, R, rI, b.from, b.to)}" fill="${b.color}" stroke="var(--surface)" stroke-width="${main ? 2 : 1.2}"></path>`;
  });

  // ticks (main gauge only)
  if (main) {
    for (let v = 0; v <= MAX; v += 5) {
      const majorTick = v % 25 === 0 || v === MAX;
      const a = angleFor(v);
      const [x1, y1] = pt(cx, cy, R, a);
      const [x2, y2] = pt(cx, cy, R - (majorTick ? 10 : 5), a);
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#25314f" stroke-width="${majorTick ? 2 : 1}" opacity="0.85"></line>`;
    }
    // scale labels
    const labels = [0, 25, 50, 75, 100, 110];
    labels.forEach(v => {
      const a = angleFor(v);
      const [x, y] = pt(cx, cy, R + 17, a);
      const anchor = a < -12 ? "end" : a > 12 ? "start" : "middle";
      s += `<text x="${x}" y="${y + 4}" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="${anchor}">${v}%</text>`;
    });
    // center labels — the value is click-to-edit when the gauge is given an address
    const editAttrs = editP == null ? "" :
      ` class="gauge-value" data-p="${editP}" data-f="oee" tabindex="0" role="button"`;
    s += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="40" font-weight="900" fill="${statusColor(value)}"${editAttrs}>${value.toFixed(1)}%</text>`;
    s += `<text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--navy)">Target ${+target.toFixed(1)}%</text>`;
  }

  // needle
  const a = angleFor(value);
  const len = main ? rI - 32 : rI - 6;
  const base = main ? 55 : 8;   // needle starts away from center on main gauge
  const [tx, ty] = pt(cx, cy, len + base, a);
  const [bx, by] = pt(cx, cy, base, a);
  const [w1x, w1y] = pt(cx, cy, base + 4, a - (main ? 4 : 8));
  const [w2x, w2y] = pt(cx, cy, base + 4, a + (main ? 4 : 8));
  s += `<polygon points="${bx},${by} ${w1x},${w1y} ${tx},${ty} ${w2x},${w2y}" fill="#1c2333"></polygon>`;
  if (!main) s += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#1c2333"></circle>`;

  s += `</svg>`;
  return s;
}

function renderPeriod(p, pi) {
  const subGauges = Object.entries(p.components).map(([name, v]) => `
    <div class="sub-gauge">
      <div class="sub-name">${name}</div>
      ${gaugeSVG(v, { size: "sub", target: DATA.targets[name] })}
      <div class="sub-value edit" contenteditable="true" spellcheck="false"
           data-kind="gauge" data-p="${pi}" data-f="${name}"
           style="color:${statusColor(v, DATA.targets[name])}">${v.toFixed(1)}%</div>
      <div class="sub-target">Target ${+DATA.targets[name].toFixed(1)}%</div>
    </div>`).join("");

  return `
  <div class="panel gauges">
    <div class="panel-title" style="background:${p.accent}">${p.title}</div>
    <div class="gauge-main">${gaugeSVG(p.oee, { target: DATA.targets.OEE, editP: pi })}</div>
    <div class="sub-gauges">${subGauges}</div>
  </div>`;
}

// Editable cell. `field` names the property on the row object; the cell
// carries its own address (period index, row index) so edits can be
// written straight back into DATA.
function cell(pi, ri, field, text, extraClass = "", style = "") {
  return `<td class="edit ${extraClass}" contenteditable="true" spellcheck="false"
    data-kind="cell" data-p="${pi}" data-r="${ri}" data-f="${field}" style="${style}">${text}</td>`;
}

function renderTable(p, pi) {
  const rows = p.top3.map((t, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      ${cell(pi, i, "focus", t.focus, "name")}
      ${cell(pi, i, "pct", t.pct.toFixed(1) + "%", "pct", `color:${paretoColor(t.pct)}`)}
      ${cell(pi, i, "mode", t.mode)}
      ${cell(pi, i, "cause", t.cause)}
      ${cell(pi, i, "owner", t.owner)}
      <td>
        <span class="pill editable ${t.status.toLowerCase()}" data-p="${pi}" data-r="${i}"
              role="button" tabindex="0" title="Click to toggle Open / Closed">${t.status}</span>
      </td>
    </tr>`).join("");

  return `
  <div class="panel">
    <div class="panel-title" style="background:${p.accent}">TOP 3 ACTIONS</div>
    <table class="top3-table">
      <thead class="light">
        <tr>
          <th>#</th><th>Focus Area</th><th>%</th>
          <th>Failure Mode</th><th>Root Cause</th><th>Owner</th><th>Status</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function render() {
  const tabs = DATA.departments.map((d, i) =>
    `<button class="dept-tab${i === activeDept ? " active" : ""}" data-d="${i}">${d.name}</button>`
  ).join("");

  document.getElementById("board").innerHTML = `
    <header class="board-header">
      <div class="dept-switch">${tabs}</div>
      <div class="board-title">
        <h1>${DATA.title}</h1>
      </div>
      <div class="edit-hint">
        <span>Click any value to edit</span>
        <button class="btn-reset" id="reset">Reset</button>
      </div>
    </header>

    <div class="columns gauges-row" id="gauges">
      ${dept().periods.map(renderPeriod).join("")}
    </div>
    <div class="columns tables-row" id="tables">
      ${dept().periods.map(renderTable).join("")}
    </div>`;

  document.getElementById("reset").addEventListener("click", resetEdits);
  lockTablesHeight();
}

function switchDept(i) {
  if (i === activeDept || !DATA.departments[i]) return;
  closeValueEditor();
  activeDept = i;
  try { localStorage.setItem(DEPT_KEY, DATA.departments[i].id); } catch (e) {}
  render();
}

/* =========================================================================
   Inline editing — Focus Area, %, Failure Mode, Root Cause, Owner, Status.
   Edits are written back into DATA and kept in localStorage so a refresh
   doesn't lose them. Reset restores the mock data defined above.
   ========================================================================= */
// Edits are stored per department, keyed by department id, so switching
// departments never mixes one department's numbers into another's.
const STORE_KEY = "oee-board-edits-v3";
const DEPT_KEY = "oee-board-dept";

function readStore() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    return raw && typeof raw === "object" ? raw : {};
  } catch (e) { return {}; }
}

function saveEdits() {
  try {
    const store = readStore();
    store[dept().id] = dept().periods.map(p => ({ oee: p.oee, components: p.components, top3: p.top3 }));
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch (e) { /* private browsing / storage disabled — edits stay in memory */ }
}

function loadEdits() {
  const store = readStore();
  DATA.departments.forEach(d => {
    const saved = store[d.id];
    if (!Array.isArray(saved)) return;
    saved.forEach((s, i) => {
      const p = d.periods[i];
      if (!p || !s) return;
      if (typeof s.oee === "number") p.oee = s.oee;
      if (s.components) Object.assign(p.components, s.components);
      if (Array.isArray(s.top3)) p.top3 = s.top3;
    });
  });
  // Reopen on whichever department was last viewed.
  try {
    const last = localStorage.getItem(DEPT_KEY);
    const i = DATA.departments.findIndex(d => d.id === last);
    if (i >= 0) activeDept = i;
  } catch (e) {}
}

// Resets the department currently on screen; the others keep their edits.
function resetEdits() {
  try {
    const store = readStore();
    delete store[dept().id];
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch (e) {}
  location.reload();
}

function renderTables() {
  document.getElementById("tables").innerHTML = dept().periods.map(renderTable).join("");
  lockTablesHeight();
}

/* The tables row is as tall as its text needs, which differs per
   department — left alone, switching departments would resize the gauges
   above it. Measuring every department off-screen and pinning the row to
   the tallest keeps the gauges rock steady across switches. */
function lockTablesHeight() {
  const tables = document.getElementById("tables");
  if (!tables) return;
  const width = tables.getBoundingClientRect().width;
  if (!width) return;

  tables.style.height = "auto";
  const probe = document.createElement("div");
  probe.className = "columns tables-row";
  probe.style.cssText =
    `position:absolute; visibility:hidden; pointer-events:none; top:0; left:-99999px; width:${width}px;`;
  document.body.appendChild(probe);

  let tallest = 0;
  DATA.departments.forEach(d => {
    probe.innerHTML = d.periods.map(renderTable).join("");
    tallest = Math.max(tallest, probe.getBoundingClientRect().height);
  });
  probe.remove();

  if (tallest) tables.style.height = Math.ceil(tallest) + "px";
}

function renderGauges() {
  document.getElementById("gauges").innerHTML = dept().periods.map(renderPeriod).join("");
}

// Gauge values (OEE and the three components) share one parser: numeric,
// clamped to the 0–110 scale and rounded to the displayed decimal.
function commitGauge(pi, field, raw) {
  const p = dept().periods[pi];
  if (!p) return false;
  const n = parseFloat(String(raw).replace(/[^0-9.]/g, ""));
  if (!isFinite(n)) return false;
  const v = Math.round(Math.min(DATA.scaleMax, Math.max(0, n)) * 10) / 10;
  if (field === "oee") {
    if (v === p.oee) return false;
    p.oee = v;
  } else {
    if (!(field in p.components) || v === p.components[field]) return false;
    p.components[field] = v;
  }
  saveEdits();
  return true;
}

// Returns true when the value actually changed and was valid.
function commitEdit(pi, ri, field, raw) {
  const row = dept().periods[pi] && dept().periods[pi].top3[ri];
  if (!row) return false;

  if (field === "pct") {
    const n = parseFloat(String(raw).replace(/[^0-9.]/g, ""));
    if (!isFinite(n)) return false;                  // unparseable — revert
    // Round to the one decimal the board displays, so what is stored
    // matches what is shown.
    const clamped = Math.round(Math.min(100, Math.max(0, n)) * 10) / 10;
    if (clamped === row.pct) return false;
    row.pct = clamped;
  } else {
    const text = String(raw).replace(/\s+/g, " ").trim();
    if (!text || text === row[field]) return false;  // empty — revert
    row[field] = text;
  }
  saveEdits();
  return true;
}

// Re-render the affected region, then flash whatever was just saved.
function refreshAfterEdit(kind, pi, ri, field) {
  if (kind === "gauge") {
    renderGauges();
    const el = document.querySelector(`.sub-value.edit[data-p="${pi}"][data-f="${field}"]`);
    if (el) el.classList.add("saved");
  } else {
    renderTables();
    const el = document.querySelector(`td.edit[data-p="${pi}"][data-r="${ri}"][data-f="${field}"]`);
    if (el) el.classList.add("saved");
  }
}

function rerender(kind) {
  if (kind === "gauge") renderGauges(); else renderTables();
}

const board = document.getElementById("board");

// Remember the original text so Escape can restore it and blur can tell
// whether anything actually changed.
board.addEventListener("focusin", e => {
  const el = e.target.closest && e.target.closest(".edit[contenteditable]");
  if (el) el.dataset.orig = el.textContent.trim();
});

board.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest(".edit[contenteditable]");
  if (!el) return;
  if (e.key === "Enter") {
    e.preventDefault();
    el.blur();
  } else if (e.key === "Escape") {
    e.preventDefault();
    el.textContent = el.dataset.orig || "";
    el.dataset.cancelled = "1";
    el.blur();
  }
});

board.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest(".edit[contenteditable]");
  if (!el) return;
  const { kind, p, r, f } = el.dataset;
  if (el.dataset.cancelled === "1") {
    delete el.dataset.cancelled;
    rerender(kind);
    return;
  }
  const value = el.textContent.trim();
  if (value === el.dataset.orig) return;             // nothing typed
  const ok = kind === "gauge" ? commitGauge(+p, f, value) : commitEdit(+p, +r, f, value);
  if (ok) refreshAfterEdit(kind, +p, +r, f);
  else rerender(kind);                               // invalid — restore
});

/* -------------------------------------------------------------------------
   The big OEE number lives inside the SVG, where contenteditable is not
   dependable. Clicking it opens a small input positioned over the number,
   which keeps the interaction identical from the user's side.
   ------------------------------------------------------------------------- */
let valueEditor = null;

function closeValueEditor() {
  if (!valueEditor) return;
  const el = valueEditor;
  valueEditor = null;                                // guard the blur handler
  el.remove();
}

function openValueEditor(target, pi) {
  closeValueEditor();
  const box = target.getBoundingClientRect();
  const input = document.createElement("input");
  input.type = "text";
  input.className = "value-editor";
  input.value = dept().periods[pi].oee.toFixed(1);
  input.setAttribute("aria-label", "OEE percentage");
  document.body.appendChild(input);
  input.style.left = (box.left + box.width / 2) + "px";
  input.style.top = (box.top + box.height / 2) + "px";
  input.style.width = Math.max(110, box.width + 24) + "px";
  valueEditor = input;
  input.focus();
  input.select();

  const finish = save => {
    if (!valueEditor) return;
    const raw = input.value;
    closeValueEditor();
    if (save) commitGauge(pi, "oee", raw);
    renderGauges();
  };
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", () => finish(true));
}

board.addEventListener("click", e => {
  const value = e.target.closest && e.target.closest("text.gauge-value");
  if (value) openValueEditor(value, +value.dataset.p);
});

board.addEventListener("keydown", e => {
  const value = e.target.closest && e.target.closest("text.gauge-value");
  if (value && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    openValueEditor(value, +value.dataset.p);
  }
});

// Wrapping changes with the window, so the locked height is remeasured.
let resizeTimer = null;
window.addEventListener("resize", () => {
  closeValueEditor();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(lockTablesHeight, 120);
});

// Status is a two-state field, so it toggles on click (or Enter/Space).
function toggleStatus(pill) {
  const { p, r } = pill.dataset;
  const row = dept().periods[+p].top3[+r];
  row.status = row.status === "OPEN" ? "CLOSED" : "OPEN";
  saveEdits();
  renderTables();
}

board.addEventListener("click", e => {
  const pill = e.target.closest && e.target.closest(".pill.editable");
  if (pill) toggleStatus(pill);

  const tab = e.target.closest && e.target.closest(".dept-tab");
  if (tab) switchDept(+tab.dataset.d);
});

board.addEventListener("keydown", e => {
  const pill = e.target.closest && e.target.closest(".pill.editable");
  if (pill && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    toggleStatus(pill);
  }
});

loadEdits();
render();
</script>
</body>
</html>
